<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>幫我買｜朋友代購任務</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#24211f;--muted:#77716c;--line:#e8e1da;--ok:#1f8a5b;--warn:#d58b20;--bad:#c94b4b;--accent:#252525}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink)}
.app{max-width:760px;margin:auto;min-height:100vh;padding:18px 16px 90px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:900;font-size:23px}.pill{background:#ebe5de;padding:8px 11px;border-radius:999px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #00000008}
h1{font-size:28px;margin:5px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted);font-size:14px}
.progress{height:12px;background:#eee7e0;border-radius:999px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--accent);width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#faf8f5;border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center}.thumb{width:72px;height:72px;border-radius:16px;background:#f0ece7;display:grid;place-items:center;font-size:32px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}
.name{font-weight:800}.rule{font-size:13px;margin-top:5px}.status{font-size:12px;padding:7px 9px;border-radius:999px;background:#eee;white-space:nowrap}
.s-wait{background:#fff1d8;color:#8a5a0d}.s-found{background:#e3efff;color:#285d9c}.s-done{background:#def3e8;color:#176c48}.s-no{background:#f9dfdf;color:#963939}
button,.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:#252525;color:white}.secondary{background:#eee8e2}.danger{background:#f6dfdf;color:#9c3636}.success{background:#def3e8;color:#176c48}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.full{grid-column:1/-1}
input,textarea,select{width:100%;border:1px solid var(--line);background:white;border-radius:13px;padding:12px;font:inherit;margin:5px 0 10px}label{font-size:13px;font-weight:700}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center}
.tabs div{max-width:760px;width:100%;display:grid;grid-template-columns:1fr 1fr;padding:8px 16px}.tab{background:transparent;color:#777}.tab.active{color:#111}
.hidden{display:none}.photo{width:100%;max-height:300px;object-fit:cover;border-radius:16px;margin-top:10px}
.notice{padding:12px;border-radius:14px;background:#fff5dc;font-size:14px;margin:10px 0}.big-rule{font-size:21px;font-weight:900;padding:14px;background:#f8f5f1;border-radius:16px;margin:12px 0}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:end;justify-content:center;z-index:5}.sheet{background:white;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.modal.show{display:flex}
.small{font-size:12px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
</style>
</head>
<body><div class="app">
<div class="top"><div class="brand">幫我買 🛍️</div><div class="pill" id="roleLabel">代購模式</div></div>
<section id="buyerView">
<div class="card"><div class="muted">朋友出國幫買東西</div><h1 id="tripName">東京代購任務 🇯🇵</h1><div class="progress"><div class="bar" id="bar"></div></div><div class="stats"><div class="stat"><b id="doneN">0</b>已購買</div><div class="stat"><b id="waitN">0</b>待處理</div><div class="stat"><b id="noN">0</b>缺貨</div></div></div>
<div id="buyerList"></div>
</section>
<section id="ownerView" class="hidden">
<div class="card"><h2>建立代購任務</h2><label>旅程名稱</label><input id="tripInput" value="東京代購任務 🇯🇵">
<div class="row"><div><label>商品名稱</label><input id="nameInput" placeholder="例如 CHANEL 280"></div><div><label>數量</label><input id="qtyInput" type="number" min="1" value="1"></div></div>
<label>必買條件</label><input id="ruleInput" placeholder="例如：只買膏體有雕花的版本">
<label>禁止條件</label><input id="noRuleInput" placeholder="例如：沒雕花不要買">
<label>備案（選填）</label><input id="backupInput" placeholder="例如：288 沒貨 → 改買 282">
<label>參考照片（選填）</label><input id="refPhoto" type="file" accept="image/*">
<label style="display:flex;gap:8px;align-items:center;margin:8px 0 14px"><input id="confirmInput" type="checkbox" style="width:auto;margin:0"> 絕對不要自己判斷：找到後一定要拍照等我確認</label>
<button class="primary" style="width:100%" onclick="addItem()">＋ 加入清單</button></div>
<div class="card"><h2>進度控制台</h2><div id="ownerList"></div></div>
</section>
</div>
<div class="tabs"><div><button class="tab active" id="buyerTab" onclick="switchRole('buyer')">🛒 幫買的人</button><button class="tab" id="ownerTab" onclick="switchRole('owner')">📝 開清單的人</button></div></div>
<div class="modal" id="modal"><div class="sheet"><div id="modalBody"></div><button class="secondary" style="width:100%;margin-top:12px" onclick="closeModal()">關閉</button></div></div>

let trip=localStorage.getItem("buyforme-trip")||"東京代購任務 🇯🇵";
let syncTimer=null;
let lastCloudUpdatedAt="";
let applyingCloud=false;

const localSave=()=>{
  localStorage.setItem("buyforme-items-v8",JSON.stringify(items));
  localStorage.setItem("buyforme-trip",trip);
};

function cloudState(){
  return {
    trip,
    items: items.map(x=>({
      id:x.id,cat:x.cat,brand:x.brand,name:x.name,qty:x.qty,model:x.model||"",
      priority:x.priority||"",note:x.note||"",status:x.status||"wait",
      img:x.img||"",shots:Array.isArray(x.shots)?x.shots:[]
    }))
  };
}

async function pushCloud(){
  if(applyingCloud)return;
  try{
    const r=await fetch("/api/state",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(cloudState())
    });
    if(!r.ok)throw new Error("sync failed");
    const data=await r.json();
    if(data.updatedAt)lastCloudUpdatedAt=data.updatedAt;
  }catch(e){console.warn("Cloud sync unavailable; local copy kept.",e)}
}

const save=()=>{
  localSave();
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushCloud,180);
};

async function pullCloud(){
  try{
    const r=await fetch("/api/state",{cache:"no-store"});
    if(!r.ok)return;
    const state=await r.json();
    if(!state || !Array.isArray(state.items)){
      await pushCloud();
      return;
    }
    if(state.updatedAt && state.updatedAt===lastCloudUpdatedAt)return;
    applyingCloud=true;
    items=state.items;
    if(typeof state.trip==="string" && state.trip)trip=state.trip;
    lastCloudUpdatedAt=state.updatedAt||"";
    localSave();
    render();
    applyingCloud=false;
  }catch(e){
    applyingCloud=false;
    console.warn("Cloud sync unavailable; using local copy.",e);
  }
}
function render(){
 document.getElementById("tripName").textContent=trip; document.getElementById("tripInput").value=trip;
 const d=items.filter(x=>x.status==="done").length,n=items.filter(x=>x.status==="no").length,w=items.length-d-n;
 doneN.textContent=d;noN.textContent=n;waitN.textContent=w;bar.style.width=(items.length?d/items.length*100:0)+"%";
 buyerList.innerHTML=items.map((x,i)=>{let b=badge(x.status);return `<div class="card item" onclick="openItem(${i})"><div class="thumb">${x.ref?`<img src="${x.ref}">`:"💄"}</div><div><div class="name">${esc(x.name)} ×${x.qty}</div><div class="rule">${esc(x.rule)}</div>${x.backup?`<div class="muted small">備案：${esc(x.backup)}</div>`:""}</div><div class="status ${b[1]}">${b[0]}</div></div>`}).join("");
 ownerList.innerHTML=items.map((x,i)=>{let b=badge(x.status);return `<div style="padding:12px 0;border-bottom:1px solid #eee"><div class="row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.rule)}</div></div><span class="status ${b[1]}">${b[0]}</span></div>${x.photo?`<img class="photo" src="${x.photo}">`:""}<div class="actions">${x.status==="found"||x.status==="help"?`<button class="success" onclick="setStatus(${i},'done')">✅ 對，可以買</button><button class="danger" onclick="setStatus(${i},'wait')">❌ 不對，繼續找</button>`:""}<button class="secondary" onclick="editItem(${i})">✏️ 編輯</button><button class="secondary" onclick="changeRef(${i})">🖼️ 換照片</button><button class="secondary full" onclick="removeItem(${i})">刪除商品</button></div></div>`}).join("")||"<div class=muted>還沒有商品</div>";
}
function openItem(i){let x=items[i],b=badge(x.status);modalBody.innerHTML=`<div class="muted">代購任務</div><h1>${esc(x.name)} ×${x.qty}</h1>${x.ref?`<img class="photo" src="${x.ref}">`:""}<div class="big-rule">⭕ ${esc(x.rule||"照參考照片購買")}</div>${x.norule?`<div class="notice">❌ ${esc(x.norule)}</div>`:""}${x.backup?`<div class="notice"><b>找不到時：</b>${esc(x.backup)}</div>`:""}${x.mustConfirm?`<div class="notice"><b>🚨 這件禁止自己判斷</b><br>找到後請先拍照，等對方確認。</div>`:""}${x.photo?`<p><b>你拍的照片：</b></p><img class="photo" src="${x.photo}">${x.status==="found"&&!x.mustConfirm?`<div class="notice"><b>照片已上傳。</b><br>如果你確定就是這個，可以直接買；不確定就留在待確認。</div>`:""}${x.status==="help"?`<div class="notice"><b>🆘 已送出求救</b><br>照片已留下，等對方查看。</div>`:""}`:""}<div class="actions"><label class="btn primary full" style="text-align:center">📸 找到了，拍照確認<input hidden type="file" accept="image/*" capture="environment" onchange="uploadFound(event,${i})"></label>${x.mustConfirm?`<button class="secondary" disabled>🔒 等對方確認</button>`:`<button class="success" onclick="setStatus(${i},'done');closeModal()">🛍️ ${x.photo?"照片已上傳，直接買":"已經買了"}</button>`}<button class="danger" onclick="setStatus(${i},'no');closeModal()">❌ 店員說沒貨</button><label class="btn secondary full" style="text-align:center">🆘 我看不懂，拍照求救<input hidden type="file" accept="image/*" capture="environment" onchange="uploadHelp(event,${i})"></label></div>`;modal.classList.add("show")}
function closeModal(){modal.classList.remove("show")}
function setStatus(i,s){items[i].status=s;save();render()}
function uploadFound(e,i){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{items[i].photo=r.result;items[i].status="found";save();render();openItem(i)};r.readAsDataURL(f)}

function uploadHelp(e,i){
 let f=e.target.files[0];if(!f)return;
 let r=new FileReader;
 r.onload=()=>{items[i].photo=r.result;items[i].status="help";save();render();openItem(i)};
 r.readAsDataURL(f);
}

function addItem(){trip=tripInput.value.trim()||trip;let f=refPhoto.files[0];let make=(ref="")=>{items.push({id:Date.now(),name:nameInput.value.trim()||"未命名商品",qty:+qtyInput.value||1,rule:ruleInput.value.trim(),norule:noRuleInput.value.trim(),backup:backupInput.value.trim(),status:"wait",mustConfirm:confirmInput.checked,photo:"",ref});save();render();nameInput.value=ruleInput.value=noRuleInput.value=backupInput.value="";refPhoto.value="";confirmInput.checked=false};if(f){let r=new FileReader;r.onload=()=>make(r.result);r.readAsDataURL(f)}else make()}
function removeItem(i){if(confirm("確定刪除這個商品？")){items.splice(i,1);save();render()}}

function editItem(i){
 let x=items[i];
 modalBody.innerHTML=`<div class="muted">編輯商品</div><h1>${esc(x.name)}</h1>
 <label>商品名稱</label><input id="eName" value="${esc(x.name)}">
 <label>數量</label><input id="eQty" type="number" min="1" value="${x.qty}">
 <label>必買條件</label><input id="eRule" value="${esc(x.rule)}">
 <label>禁止條件</label><input id="eNoRule" value="${esc(x.norule)}">
 <label>備案</label><input id="eBackup" value="${esc(x.backup)}">
 <label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input id="eConfirm" type="checkbox" style="width:auto;margin:0" ${x.mustConfirm?"checked":""}> 絕對不要自己判斷：一定要拍照等確認</label>
 <button class="primary" style="width:100%" onclick="saveEdit(${i})">儲存修改</button>`;
 modal.classList.add("show");
}
function saveEdit(i){
 let x=items[i]; x.name=eName.value.trim()||x.name;x.qty=+eQty.value||1;x.rule=eRule.value.trim();x.norule=eNoRule.value.trim();x.backup=eBackup.value.trim();x.mustConfirm=eConfirm.checked;save();render();closeModal();
}
function changeRef(i){
 modalBody.innerHTML=`<div class="muted">更換參考照片</div><h1>${esc(items[i].name)}</h1>${items[i].ref?`<img class="photo" src="${items[i].ref}">`:""}<label class="btn primary" style="display:block;text-align:center;margin-top:14px">📷 選擇新照片<input hidden type="file" accept="image/*" onchange="saveRef(event,${i})"></label>`;
 modal.classList.add("show");
}
function saveRef(e,i){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{items[i].ref=r.result;save();render();closeModal()};r.readAsDataURL(f)}

function switchRole(r){buyerView.classList.toggle("hidden",r!=="buyer");ownerView.classList.toggle("hidden",r!=="owner");buyerTab.classList.toggle("active",r==="buyer");ownerTab.classList.toggle("active",r==="owner");roleLabel.textContent=r==="buyer"?"代購模式":"清單建立者"}
tripInput?.addEventListener("change",()=>{trip=tripInput.value;save();render()});render();pullCloud();setInterval(pullCloud,5000);
</script></body></html>
